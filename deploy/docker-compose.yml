# The frontend container serves the SPA and proxies /api and /auth to the
# backend. Ports are only exposed on the Docker network, not bound on the host:
# point your reverse proxy at frontend:3000 (and backend:8080 if the browser
# calls the API directly via BACKEND_URL, which then needs FRONTEND_URL for CORS).
services:
  backend:
    container_name: backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PORT: "8080"
      # Session cookie is HTTPS-only; serve the site over TLS (e.g. a reverse proxy in front of port 3000).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # nginx in the frontend container sets X-Real-IP, used for rate limiting.
      TRUST_PROXY: "true"
      # Encrypts users' storage keys at rest. Optional: leave unset to disable file uploads.
      # Keep it safe and stable; losing or changing it makes saved keys unreadable.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Browser origins allowed to call the API cross-origin (comma-separated).
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-}
      # Outgoing mail for verification and password-reset codes. Without SMTP_HOST,
      # codes are only written to the backend log, so set it in production.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: where new product feedback is emailed, and the Reply-To on admin replies.
      FEEDBACK_NOTIFY_EMAIL: ${FEEDBACK_NOTIFY_EMAIL:-}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      BACKEND_UPSTREAM: http://backend:8080
      # Public backend URL for the browser; empty keeps API calls same-origin via nginx.
      API_URL: ${BACKEND_URL:-}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
