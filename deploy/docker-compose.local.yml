services:
  backend:
    container_name: backend-local
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      # 'host.docker.internal' lets the container reach Postgres running on the host.
      # The dev database predates the rename to Fronko, so it keeps its original name.
      DATABASE_URL: postgres://credensync:1234567890@host.docker.internal:55000/credensync?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      PORT: "8080"
      # Served over plain http://localhost:3000, so the cookie can't be Secure.
      COOKIE_SECURE: "false"
      # Requests arrive via nginx. Port 8080 is also exposed below for debugging,
      # where X-Real-IP could be spoofed; that's acceptable locally only.
      TRUST_PROXY: "true"
      # Development-only key for encrypting storage credentials. Never reuse it in production.
      SECRETS_KEY: YK25gq0GTgmd8wFLSqwwb4J34fpK5hygVrWPpPCaBxA=
      # Lets storage point at a local MinIO (http, private address). Development only.
      STORAGE_ALLOW_PRIVATE_ENDPOINTS: "true"
      # Local runs are same-origin through nginx; don't inherit production URLs from .env.
      CORS_ALLOWED_ORIGINS: ""
      # Mail goes to the local Mailpit below; read it at http://localhost:8025.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Fronko <no-reply@fronko.local>"
      # New product feedback is emailed here (shows up in Mailpit too).
      FEEDBACK_NOTIFY_EMAIL: admin@fronko.local
      # Development mode: allows `docker exec backend-local ./fronko seed`.
      FRONKO_ENV: development
      PUBLIC_URL: http://localhost:3000
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailpit

  # Catches every email the backend sends; nothing leaves your machine.
  # Inbox UI: http://localhost:8025
  mailpit:
    container_name: mailpit-local
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  frontend:
    container_name: frontend-local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      BACKEND_UPSTREAM: http://backend:8080
      API_URL: ""
    # Bound on the host so you can open http://localhost:3000 locally.
    ports:
      - "3000:3000"
    depends_on:
      - backend
