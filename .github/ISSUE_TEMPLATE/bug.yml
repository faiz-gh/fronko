name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the [existing issues](https://github.com/faiz-gh/fronko/issues) first.
        **Security problems don't belong here.** Report them privately as described in [SECURITY.md](https://github.com/faiz-gh/fronko/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally starting from a fresh account or `make seed`.
      placeholder: |
        1. Sign in as an organisation admin
        2. Open …
        3. Click …
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit you're running (`git rev-parse --short HEAD`).
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker Compose (deploy/docker-compose.yml)
        - Local development (Vite dev server and go run)
        - Docker Compose for local development (deploy/docker-compose.local.yml)
        - Something else (describe below)
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Cards and the card editor
        - Public card page
        - Leads
        - Files
        - Teams and users
        - Analytics
        - Email signatures
        - Integrations
        - Sign-in and accounts
        - Platform admin
        - Deployment and configuration
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For frontend problems, e.g. "Safari 19 on iPhone 16".
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend logs or browser console errors. Remove secrets and personal data first.
      render: text
