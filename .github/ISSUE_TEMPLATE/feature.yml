name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a new CRM, calendar, directory or sign-in provider, use the **Integration request** template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem and who has it, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself, once a maintainer has agreed on the approach.
