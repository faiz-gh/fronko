<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Runtime settings (API URL), written when the container starts. -->
		<script src="/config.js"></script>
		<script>
			// Apply the dashboard theme before first paint to avoid a light flash.
			// Mirrors $lib/theme.svelte.ts; other pages always start light.
			(function () {
				if (!location.pathname.startsWith('/dashboard')) return;
				var pref = 'system';
				try { pref = localStorage.getItem('fronko-theme') || 'system'; } catch (e) {}
				var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
