server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change, so cache them aggressively
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API and auth requests to the backend container.
    # No URI on proxy_pass, so the /api and /auth prefixes are preserved.
    location /api/ {
        # Photo and PDF uploads (the backend enforces 5 MB / 20 MB per type).
        client_max_body_size 25m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host; # keeps the port, so it matches the browser's Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host; # keeps the port, so it matches the browser's Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
